<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 手机适配：
     · viewport-fit=cover 让页面铺到刘海/圆角区域，配合 css 里的 env(safe-area-inset-*)
     · 游戏是画布操作，禁掉双击缩放和双指缩放，免得玩的时候画面被放大 -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="鲸鲸酷跑 —— 一个纯前端的横版跑酷小游戏（电脑键盘 / 手机触屏都能玩）">
<meta name="theme-color" content="#1b3a5c">

<!-- 加到手机桌面后按 App 打开（全屏、无浏览器地址栏） -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="鲸鲸酷跑">
<meta name="format-detection" content="telephone=no">

<!-- 图标用内联 SVG（data URI），这样本地 file:// 打开也不会 404，
     上传到 GitHub Pages 也不依赖额外文件 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312151c'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ffd166'/%3E%3Crect x='4' y='25' width='24' height='4' fill='%234a5568'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2312151c'/%3E%3Ccircle cx='90' cy='86' r='40' fill='%23ffd166'/%3E%3Crect x='22' y='140' width='136' height='22' fill='%234a5568'/%3E%3C/svg%3E">

<!-- 分享预览 -->
<meta property="og:type" content="website">
<meta property="og:title" content="鲸鲸酷跑">
<meta property="og:description" content="跳到鲸元券上、躲开高墙藤壶和深坑，死了还能看广告原地复活">

<link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>
<canvas id="c"></canvas>

<!-- 触屏提示：只在「触摸设备 + 刚进游戏」时出现几秒，然后自己淡掉。
     手机上第一次玩不知道点哪儿，这个很有用。 -->
<div id="touchHint" class="hidden" aria-hidden="true">
  <div class="touchHintTop">↑ 点这里 跳 / 二段跳</div>
  <div class="touchHintLine"></div>
  <div class="touchHintBottom">↓ 按住这里 滑铲</div>
</div>

<!-- 开场主菜单（唯一一份）：首次进入游戏时显示，点【开始游戏】后隐藏。
     配图在 js/03_assets.js 的 MENU_IMAGE，不要在这里塞 <img>。 -->
<div id="menuOverlay" class="hidden" style="
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 50% 40%, rgba(30,36,48,.35), rgba(8,10,16,.92));
  z-index: 50;
  padding: 20px;
  box-sizing: border-box;
">
  <div style="
    display: flex; align-items: center; justify-content: center;
    gap: 32px; flex-wrap: wrap;
    max-width: 100%;
  ">
  <div style="
    width: min(90vw, 460px);
    background: rgba(30, 36, 48, .94);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 22px;
    padding: 34px 36px 30px;
    text-align: center;
    box-shadow: 0 30px 90px rgba(0,0,0,.7);
    font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: #e8eefc;
  ">
    <h1 style="color:#ffd166;font-size:36px;letter-spacing:6px;margin:0 0 20px;">鲸鲸酷跑</h1>
    <p style="color:#ffd166;font-size:13px;line-height:1.7;letter-spacing:.5px;margin:0 0 26px;text-align:center;">用户的白饭被大肥鱼吃光了！！！<br>于是大肥鱼和用户踏上了攒鲸元券买白饭的路……</p>

    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:18px;">

      <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;padding:7px 14px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);">
        <span style="display:inline-flex;gap:6px;">
          <span style="display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:28px;padding:0 8px;border-radius:7px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.25);font-size:13px;font-weight:800;">空格</span>
          <span style="display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:28px;padding:0 8px;border-radius:7px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.25);font-size:13px;font-weight:800;">↑</span>
          <span style="display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:28px;padding:0 8px;border-radius:7px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.25);font-size:13px;font-weight:800;">W</span>
        </span>
        <span style="color:#c9d2e0;font-size:14px;">跳跃 / 二段跳</span>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;padding:7px 14px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);">
        <span style="display:inline-flex;gap:6px;">
          <span style="display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:28px;padding:0 8px;border-radius:7px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.25);font-size:13px;font-weight:800;">↓</span>
          <span style="display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:28px;padding:0 8px;border-radius:7px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.25);font-size:13px;font-weight:800;">S</span>
        </span>
        <span style="color:#c9d2e0;font-size:14px;">滑铲 / 快速下落</span>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;padding:7px 14px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);">
        <span style="display:inline-flex;gap:6px;">
          <span style="display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:28px;padding:0 8px;border-radius:7px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.25);font-size:13px;font-weight:800;">Z</span>
        </span>
        <span style="color:#c9d2e0;font-size:14px;">使用铁盆</span>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;padding:7px 14px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);">
        <span style="display:inline-flex;gap:6px;">
          <span style="display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:28px;padding:0 8px;border-radius:7px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.25);font-size:13px;font-weight:800;">M</span>
        </span>
        <span style="color:#c9d2e0;font-size:14px;">静音开关</span>
      </div>

    </div>

    <p style="color:#697386;font-size:13px;margin:0 0 18px;">触屏：点上半屏跳跃 · 按住下半屏滑铲</p>

    <!-- 背景音乐音量：拖动即时生效，选择存在浏览器里 -->
    <div style="
      display:flex; align-items:center; gap:10px;
      padding:8px 14px; margin:0 0 18px;
      border-radius:11px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.06);
    ">
      <span id="bgmIcon" style="font-size:16px;line-height:1;flex:none;">🎵</span>
      <input id="bgmVolume" type="range" min="0" max="100" value="38" style="
        flex:1; height:6px; margin:0; cursor:pointer;
        accent-color:#ffb703;
        background:transparent;
      ">
      <span id="bgmVolumeNum" style="color:#c9d2e0;font-size:13px;font-weight:700;min-width:34px;text-align:right;">38%</span>
    </div>

    <button id="btnStartGame" style="
      width: 100%;
      padding: 15px 0;
      border-radius: 14px;
      border: none;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #ffb703, #fb8500);
      color: #2b1a00;
      box-shadow: 0 8px 26px rgba(251, 133, 0, .4);
      cursor: pointer;
      font-family: inherit;
    ">Let me go !</button>
  </div>

  <!-- ★ 主菜单右侧的素材空位。换图：把 img 的 src 换成你的图片路径即可 -->
  <div id="menuImageBox" style="
    width: 300px;
    height: 380px;
    border-radius: 22px;
    background: #2a3140;
    border: 1px solid #333c4e;
    display: flex; align-items: center; justify-content: center;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    box-shadow: 0 30px 90px rgba(0,0,0,.7);
    flex: none;
  ">
    <span id="menuImageLabel" style="
      color: #697386; font-size: 14px; letter-spacing: 1px;
      padding: 0 14px; text-align: center; line-height: 1.6;
    ">主菜单配图<br>（素材插入位置）</span>
  </div>
  </div>
</div>

<!-- 开场主菜单：首次进入游戏时显示，点【开始游戏】后隐藏。
     样式全部内联，保证 style.css 里没这段也能正常显示 -->

<!-- 道具栏已移除，只保留下方居中的道具按钮 -->

<!-- =========================================================
     下面三块是 HTML 界面层（死亡弹窗 / 广告弹窗）。
     玩游戏时是隐藏的；只有在 state = dead / gameover / ad 时才显示。
     想把弹窗做得更花哨，直接改这里 + css/style.css 就行。
     ========================================================= -->

<!-- 死亡弹窗 -->
<div id="overlay" class="hidden">
  <div class="panel">
    <h2 id="overlayTitle">游戏结束</h2>
    <div class="totalCoinBox">
      <span class="totalCoinIcon"></span>
      <span>鲸元券 <b id="totalCoinNum">0</b></span>
    </div>
    <div class="btnRow">
      <button id="btnRetry">重试</button>
      <button id="btnShop">商店</button>
      <button id="btnAd">看广告复活</button>
    </div>
  </div>
</div>

<!-- 铁盆按钮：屏幕下方居中，按 Z 或点它使用。
     左上角快捷键 Z，右上角数量角标，中间是铁盆图标 -->
<div class="potButtonWrap">
  <div id="potButton" class="potButton hidden">
    <span class="potKey">Z</span>
    <span class="potDot"></span>
    <b id="potButtonCount" class="potButtonCount">0</b>
  </div>
</div>

<!-- 商店弹窗 -->
<div id="shopOverlay" class="hidden">
  <div class="shopPanel">
    <button id="btnShopClose" class="shopClose" aria-label="关闭">×</button>
    <h2>商店</h2>
    <div class="shopBody">
      <div class="shopItem" id="itemPot">
        <div class="shopIcon shopIconPot"></div>
        <div class="shopPrice"><span class="coinDot"></span><span>50</span></div>
        <div class="shopOwned">拥有 <b id="potOwned">0</b></div>
      </div>
      <div class="shopItem" id="itemRice">
        <div class="shopIcon shopIconRice"></div>
        <div class="shopPrice"><span class="coinDot"></span><span>1000</span></div>
        <div class="shopOwned">拥有 <b id="riceOwned">0</b></div>
      </div>
    </div>
    <div class="shopCoins"><span class="coinDot"></span>鲸元券 <b id="shopCoinsNum">0</b></div>
  </div>
</div>

<!-- 购买确认弹窗 -->
<div id="buyOverlay" class="hidden">
  <div class="buyPanel">
    <h3 id="buyTitle">铁盆</h3>
    <div class="buyPriceRow"><span class="coinDot"></span><span id="buyPrice">50</span></div>
    <div id="buyMsg" class="buyMsg"></div>
    <div class="btnRow">
      <button id="btnBuyCancel">取消</button>
      <button id="btnBuyConfirm">购买</button>
    </div>
  </div>
</div>

<!-- 白饭成功界面：结构和广告界面一样，底下一颗【继续游戏】按钮 -->
<div id="riceOverlay" class="hidden">
  <div class="adPanel">
    <button id="btnRiceClose2" class="shopClose" aria-label="关闭">×</button>
    <h1 class="victoryTitle">游戏胜利！</h1>
    <div id="riceImageBox"><span id="riceImageLabel">大肥鱼图片（素材插入位置）</span></div>
    <h2 class="riceTitle">大肥鱼成功吃到了白饭！！！</h2>
    <button id="btnRiceContinue">继 续 游 戏</button>
  </div>
</div>

<!-- 白饭成功界面：买完白饭后弹出 -->

<!-- 广告界面 -->
<div id="adOverlay" class="hidden">
  <div class="adPanel">
    <div id="adImageBox"><span id="adImageLabel">广告图片</span></div>
    <a id="adLink" class="adLink hidden" target="_blank" rel="noopener noreferrer">
      了解更多 →
    </a>
    <div id="adCountdown">5</div>
    <div id="adHint">秒后可复活</div>
    <button id="btnAdRevive" class="hidden">复 活</button>
  </div>
</div>

<!-- =========================================================
     脚本按编号顺序加载，全部是普通 <script>（不用 ES module）：
     这样双击 index.html 用 file:// 打开也能跑，不需要起服务器。

     每个文件负责什么，见 README.md「想改点什么」那张表。
     注意：后面的文件能用到前面文件里定义的变量/函数，反过来不行。
     ========================================================= -->
<script src="js/00_audio.js?v=1"></script>
<script src="js/01_config.js?v=1"></script>
<script src="js/02_utils.js?v=1"></script>
<script src="js/03_assets.js?v=1"></script>
<script src="js/04_gamestate.js?v=1"></script>
<script src="js/05_player.js?v=1"></script>
<script src="js/06_obstacles.js?v=1"></script>
<script src="js/07_revive.js?v=1"></script>
<script src="js/08_input.js?v=1"></script>
<script src="js/09_update.js?v=1"></script>
<script src="js/10_camera.js?v=1"></script>
<script src="js/11_render_terrain.js?v=1"></script>
<script src="js/12_render_entity.js?v=1"></script>
<script src="js/13_render_player.js?v=1"></script>
<script src="js/14_hud.js?v=1"></script>
<script src="js/16_shop.js?v=1"></script>
<script src="js/15_main.js?v=1"></script>
</body>
</html>
